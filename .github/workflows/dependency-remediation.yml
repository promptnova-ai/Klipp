name: Remediate SDK 58 dependency audit

on:
  push:
    branches:
      - fix/sdk58-dependency-security-20261120
    paths:
      - .github/workflows/dependency-remediation.yml

permissions:
  contents: write

concurrency:
  group: klipp-sdk58-dependency-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout remediation branch
        uses: actions/checkout@v4
        with:
          ref: fix/sdk58-dependency-security-20261120
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Update Expo SDK 58 patch and align Expo packages
        working-directory: app
        run: |
          npm install expo@~58.0.24
          npx expo install --fix

      - name: Apply non-breaking npm security fixes
        working-directory: app
        run: |
          npm audit fix || true
          npm audit --json > npm-audit-remediated.json || true
          node -e 'const r=require("./npm-audit-remediated.json"); const v=r.metadata?.vulnerabilities ?? {}; console.log("Post-remediation audit:", JSON.stringify(v)); for (const [n,x] of Object.entries(r.vulnerabilities ?? {})) console.log(n + ": " + x.severity + "; direct=" + x.isDirect + "; fix=" + JSON.stringify(x.fixAvailable));'

      - name: Commit dependency manifests and lockfile
        run: |
          rm -f .github/workflows/dependency-remediation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/package.json app/package-lock.json
          git commit -m "fix(deps): remediate SDK 58 dependency advisories"
          git push origin fix/sdk58-dependency-security-20261120

      - name: Reinstall exact lockfile
        working-directory: app
        run: npm ci

      - name: TypeScript
        working-directory: app
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: app
        run: npm run lint

      - name: Expo SDK compatibility check
        working-directory: app
        run: npx expo install --check

      - name: Export iOS JavaScript bundle
        working-directory: app
        run: npx expo export --platform ios --output-dir dist-ios

      - name: Export Android JavaScript bundle
        working-directory: app
        run: npx expo export --platform android --output-dir dist-android

      - name: Enforce zero high or critical dependency findings
        working-directory: app
        run: |
          npm audit --json > npm-audit-final.json || true
          node -e 'const r=require("./npm-audit-final.json"); const v=r.metadata?.vulnerabilities ?? {}; console.log("Final audit:", JSON.stringify(v)); if ((v.high ?? 0) > 0 || (v.critical ?? 0) > 0) process.exit(1);'
