name: Validate Klipp app

on:
  push:
    branches:
      - main
      - feat/caribbean-utility-standalone
    paths:
      - "app/**"
      - "supabase/functions/**"
      - ".github/workflows/validate-app.yml"
      - "docs/KLIPP-QUALITY-GATES.md"
      - "docs/KLIPP-VISUAL-AUDIT.md"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "supabase/functions/**"
      - ".github/workflows/validate-app.yml"
      - "docs/KLIPP-QUALITY-GATES.md"
      - "docs/KLIPP-VISUAL-AUDIT.md"

  workflow_dispatch:

concurrency:
  group: klipp-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-checks:
    name: Lint, TypeScript and web export
    timeout-minutes: 30
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Summarize dependency security advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const report = require('/tmp/npm-audit.json'); console.log('Dependency advisories:', JSON.stringify(report.metadata?.vulnerabilities ?? {})); for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) console.log(item.severity.toUpperCase(), name, 'direct=' + item.isDirect, 'fix=' + JSON.stringify(item.fixAvailable));"

      - name: Run project-wide Expo lint (baseline visibility)
        run: npm run lint

      - name: Lint the changed admin screen
        run: npx eslint src/components/admin-screen.tsx

      - name: Lint the changed client booking screen
        run: npx eslint src/components/new-booking-screen.tsx

      - name: Lint the changed client home screen
        run: npx eslint 'src/app/(client)/index.tsx'

      - name: Lint the changed client addresses screen
        run: npx eslint src/components/client-addresses-screen.tsx

      - name: Lint the changed authentication screen
        run: npx eslint src/components/auth-screen.tsx

      - name: Lint the professional registration flow
        run: npx eslint src/components/pro-registration-screen.tsx

      - name: Lint notifications, chat deep links and push registration
        run: npx eslint src/components/notifications-screen.tsx src/components/client-bookings-screen.tsx src/components/pro-agenda-screen.tsx src/lib/push-notifications.ts src/lib/push-notifications.web.ts

      - name: Lint client tracking and lifecycle screen
        run: npx eslint src/components/client-tracking-screen.tsx

      - name: Lint shared UI primitives and role-aware header
        run: npx eslint src/components/ui-primitives.tsx src/components/brand-screen-header.tsx

      - name: Lint all redesigned role screens and shared account surfaces
        run: >-
          npx eslint
          src/components/pro-requests-screen.tsx
          src/components/pro-profile-screen.tsx
          src/components/pro-agenda-screen.tsx
          src/components/admin-operations-panel.tsx
          src/components/account-panel.tsx
          src/components/auth-screen.native.tsx
          'src/app/(client)/index.native.tsx'
          src/components/klipp-tab-bar.tsx
          src/components/role-guard.tsx
          src/components/location-picker.native.tsx
          src/components/location-picker.web.tsx
          src/components/coverage-radius-picker.native.tsx
          src/components/coverage-radius-picker.web.tsx
          src/components/admin-operations-map.native.tsx
          src/components/admin-operations-map.web.tsx
          src/components/tracking-map.native.tsx
          src/components/tracking-map.web.tsx
          src/components/animated-icon.tsx
          src/components/animated-icon.web.tsx
          src/lib/push-notifications.ts
          src/lib/pro-location-task.ts
          src/components/ui-kit.tsx
          src/theme/tokens.ts
          src/theme/themes.ts

      - name: Run TypeScript
        run: npm run typecheck

      - name: Export web app
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

      - name: Install Chromium for responsive UI captures
        run: npx --yes playwright install --with-deps chromium

      - name: Capture responsive public entry screenshots
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/klipp-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
          npx --yes playwright screenshot --browser chromium --viewport-size "390,844" --full-page --wait-for-timeout 3500 http://127.0.0.1:4173/ /tmp/klipp-mobile-390.png
          npx --yes playwright screenshot --browser chromium --viewport-size "1440,900" --full-page --wait-for-timeout 3500 http://127.0.0.1:4173/ /tmp/klipp-desktop-1440.png

      - name: Upload responsive UI captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klipp-visual-audit-screenshots
          path: /tmp/klipp-*.png
          if-no-files-found: warn

  edge-function-checks:
    name: Edge Function checks
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test shared Edge Function utilities
        run: deno test supabase/functions/_shared/auth_test.ts

      - name: Type-check notification dispatcher
        run: deno check supabase/functions/dispatch-notifications/index.ts
      
      - name: Type-check automatic booking dispatcher
        run: deno check supabase/functions/auto-assign-booking/index.ts

      - name: Type-check booking route ETA
        run: deno check supabase/functions/booking-route-eta/index.ts
