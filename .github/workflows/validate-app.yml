name: Validate Klipp app

on:
  pull_request:
    branches:
      - security/008-profile-permissions
    paths:
      - "app/**"
      - ".github/workflows/validate-app.yml"

permissions:
  contents: read

jobs:
  app-checks:
    name: Lint and TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Expo lint
        run: npm run lint

      - name: Run TypeScript
        run: npx tsc --noEmit
