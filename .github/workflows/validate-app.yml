name: Validate Klipp app

on:
  pull_request:
    branches:
      - main
      - security/008-profile-permissions
    paths:
      - "app/**"
      - ".github/workflows/validate-app.yml"

permissions:
  contents: read

jobs:
  app-checks:
    name: Lint and TypeScript
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run project-wide Expo lint (baseline visibility)
        run: npm run lint
        continue-on-error: true

      - name: Lint booking, notification and admin screens
        run: >-
          npx eslint
          src/components/admin-screen.tsx
          src/components/new-booking-screen.tsx
          src/components/client-bookings-screen.tsx
          src/components/pro-requests-screen.tsx
          src/components/notifications-screen.tsx
          src/components/notification-tab-icon.tsx
          src/components/pro-agenda-screen.tsx

      - name: Run TypeScript
        run: npx tsc --noEmit
