name: Deploy Klipp preview to GitHub Pages

on:
  push:
    branches:
      - feat/caribbean-utility-standalone
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Export Expo Web
        working-directory: app
        env:
          GITHUB_PAGES: "true"
          # Real values are optional for a UI-only preview. Authentication and
          # database requests require the repository variables/secrets to be set.
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://laneosajzwskktschhex.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'sb_publishable_K0AsNyOGGOkLXNuLCRyb4w_J78cmZIg' }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: npx expo export --platform web --output-dir dist
      - name: Verify web export and SPA entry point
        working-directory: app
        run: |
          test -s dist/index.html
          cp dist/index.html dist/404.html
          test -s dist/404.html
          echo "Expo web export and GitHub Pages fallback are present."
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish preview
        id: deployment
        uses: actions/deploy-pages@v4
