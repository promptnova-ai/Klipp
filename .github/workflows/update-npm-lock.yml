name: Apply compatible npm security fixes

on:
  push:
    branches:
      - fix/npm-compatible-audit-updates
    paths:
      - "app/package.json"
      - "app/package-lock.json"
      - ".github/workflows/update-npm-lock.yml"

permissions:
  contents: read

jobs:
  compatible-audit-fixes:
    name: Apply non-breaking dependency fixes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Apply compatible npm audit fixes
        run: npm audit fix --package-lock-only || true

      - name: Commit lockfile updates
        working-directory: .
        run: |
          if git diff --quiet -- app/package-lock.json; then
            echo "No compatible lockfile updates available."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/package-lock.json
            git commit -m "chore: apply compatible npm audit fixes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Install updated dependencies
        run: npm ci

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Export web app
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

      - name: Report remaining audit summary
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e "const report = require('/tmp/npm-audit.json'); console.log('Remaining advisories:', JSON.stringify(report.metadata?.vulnerabilities ?? {}));"
